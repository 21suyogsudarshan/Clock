name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Force Clean Environment & Build APK
        run: |
          # 1. Force initialize node and install Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 2. Force create the 'www' folder Capacitor needs
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js www/ || true
          
          # 3. Force initialize Capacitor config to point to 'www'
          npx cap init "Apex Clock" "com.suyog.clock" --web-dir www --force
          
          # 4. Generate the Android platform natively on the server
          npx cap add android
          npx cap sync android
          
          # 5. Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexClock-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk