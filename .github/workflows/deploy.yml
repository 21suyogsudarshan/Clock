name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean Environment & Build
        run: |
          rm -rf android www capacitor.config.* package*.json node_modules
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js www/ || true
          
          npx cap init "Forge Clock" "com.suyog.clock" --web-dir www
          
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeClock-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk