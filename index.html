<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge Clock</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Forge Clock</h1>
      <p class="subtitle">World Clock, Alarms & Precision Stopwatch</p>
    </header>

    <!-- Main Clock Display -->
    <section class="clock-card">
      <div id="liveClock" class="digital-time">00:00:00</div>
      <div id="liveDate" class="digital-date">Loading date...</div>
    </section>

    <!-- Alarm Configuration Section -->
    <section class="card">
      <h2>Set Alarm</h2>
      <div class="form-group">
        <label for="alarmTime">Alarm Time:</label>
        <input type="time" id="alarmTime" required />
      </div>

      <div class="form-group">
        <label for="alarmSoundSelect">Select Ringtone (100 Tones):</label>
        <select id="alarmSoundSelect"></select>
      </div>

      <div class="button-group">
        <button id="setAlarmBtn" class="btn primary">Set Alarm</button>
        <button id="testSoundBtn" class="btn secondary">Test Sound & Vibrate</button>
      </div>

      <div id="alarmStatus" class="status-msg">No active alarm set</div>
    </section>

    <!-- Stopwatch Section -->
    <section class="card">
      <h2>Stopwatch</h2>
      <div id="swDisplay" class="digital-time small">00:00.00</div>
      <div class="button-group">
        <button id="swStartBtn" class="btn primary">Start</button>
        <button id="swLapBtn" class="btn secondary" disabled>Lap</button>
        <button id="swResetBtn" class="btn danger" disabled>Reset</button>
      </div>
      <ul id="swLaps" class="laps-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
